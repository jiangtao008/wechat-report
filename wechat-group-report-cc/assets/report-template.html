<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{GROUP_NAME}} 群聊动态报告</title>
  <script src="https://cdn.jsdelivr.net/npm/wordcloud@1.2.3/src/wordcloud2.min.js"></script>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(10, 18, 38, 0.88);
      --panel-strong: rgba(14, 25, 52, 0.96);
      --line: rgba(90, 150, 255, 0.22);
      --text: #dbe7ff;
      --muted: #8ea4d4;
      --cyan: #4de2ff;
      --blue: #5b8cff;
      --green: #3bf0c3;
      --glow: 0 0 24px rgba(77, 226, 255, 0.16);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91, 140, 255, 0.24), transparent 28%),
        radial-gradient(circle at top right, rgba(77, 226, 255, 0.18), transparent 24%),
        linear-gradient(180deg, #040712 0%, #081022 52%, #050816 100%);
      min-height: 100vh;
      padding: 28px;
    }

    .container {
      max-width: 960px;
      margin: 0 auto;
      background: linear-gradient(180deg, rgba(9, 16, 34, 0.92), rgba(6, 11, 24, 0.94));
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: var(--glow);
      overflow: hidden;
      position: relative;
    }

    .container::before {
      content: "";
      position: absolute;
      inset: 0;
      background:
        linear-gradient(90deg, transparent 0, rgba(77, 226, 255, 0.04) 50%, transparent 100%);
      pointer-events: none;
    }

    .hero {
      padding: 40px 40px 28px;
      border-bottom: 1px solid var(--line);
      background:
        linear-gradient(135deg, rgba(77, 226, 255, 0.08), transparent 45%),
        linear-gradient(180deg, rgba(91, 140, 255, 0.08), transparent 60%);
    }

    .eyebrow {
      display: inline-block;
      padding: 6px 12px;
      border: 1px solid rgba(77, 226, 255, 0.35);
      border-radius: 999px;
      color: var(--cyan);
      font-size: 12px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: 34px;
      line-height: 1.2;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .subtitle {
      margin-top: 10px;
      color: var(--muted);
      font-size: 15px;
    }

    .section {
      padding: 28px 40px;
      border-top: 1px solid rgba(90, 150, 255, 0.12);
    }

    h2 {
      margin: 0 0 18px;
      font-size: 20px;
      color: #eef5ff;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    h2::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      box-shadow: 0 0 12px rgba(77, 226, 255, 0.45);
    }

    ul, ol {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li {
      margin-bottom: 14px;
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--panel), var(--panel-strong));
      border: 1px solid rgba(90, 150, 255, 0.16);
    }

    strong {
      color: #ffffff;
    }

    .ai-note {
      display: block;
      margin-top: 8px;
      color: var(--green);
      font-size: 14px;
    }

    .topic-title {
      display: block;
      position: relative;
      margin-bottom: 12px;
      padding: 12px 16px 12px 18px;
      border-radius: 14px;
      font-size: 20px;
      font-weight: 800;
      line-height: 1.4;
      color: #f6fbff;
      letter-spacing: 0.02em;
      background:
        linear-gradient(90deg, rgba(77, 226, 255, 0.16), rgba(91, 140, 255, 0.08) 55%, rgba(91, 140, 255, 0.02));
      border: 1px solid rgba(77, 226, 255, 0.18);
      box-shadow:
        inset 0 1px 0 rgba(255, 255, 255, 0.05),
        0 0 18px rgba(77, 226, 255, 0.08);
    }

    .topic-title::before {
      content: "";
      position: absolute;
      left: 0;
      top: 10px;
      bottom: 10px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--cyan), var(--blue));
      box-shadow: 0 0 16px rgba(77, 226, 255, 0.45);
    }

    .topic-step {
      display: block;
      margin-top: 4px;
      color: #c9d8f8;
      line-height: 1.75;
    }

    .topic-act {
      display: block;
      margin-top: 12px;
      margin-bottom: 6px;
      color: var(--cyan);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.06em;
    }

    .highlight-quote {
      margin-top: 10px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(77, 226, 255, 0.08);
      border: 1px solid rgba(77, 226, 255, 0.16);
    }

    .highlight-text {
      display: block;
      color: #eef5ff;
      line-height: 1.8;
    }

    .highlight-author {
      display: block;
      margin-top: 8px;
      text-align: right;
      color: var(--muted);
      font-size: 12px;
    }

    .topic-participants {
      display: block;
      margin-top: 10px;
      color: #9db5e6;
      font-size: 13px;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 12px;
    }

    .summary-card {
      padding: 16px 18px;
      border-radius: 16px;
      background: linear-gradient(180deg, var(--panel), var(--panel-strong));
      border: 1px solid rgba(90, 150, 255, 0.16);
    }

    .summary-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
    }

    .summary-value {
      display: block;
      color: #ffffff;
      font-size: 24px;
      font-weight: 700;
    }

    .summary-line {
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      background: linear-gradient(180deg, rgba(12, 20, 42, 0.88), rgba(8, 14, 30, 0.94));
      border: 1px solid rgba(90, 150, 255, 0.16);
      color: #dbe7ff;
    }

    .trend-card {
      grid-column: 1 / -1;
      padding: 22px 22px 18px;
      border-radius: 18px;
      background: linear-gradient(180deg, var(--panel), var(--panel-strong));
      border: 1px solid rgba(90, 150, 255, 0.16);
    }

    .trend-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: #b9cbff;
      font-size: 13px;
    }

    .trend-title {
      font-weight: 700;
      color: #ffffff;
      font-size: 15px;
    }

    .trend-canvas {
      display: block;
      width: 100%;
      height: 260px;
      border-radius: 14px;
      background:
        linear-gradient(to bottom, rgba(77, 226, 255, 0.04), rgba(255, 255, 255, 0.01)),
        rgba(255, 255, 255, 0.01);
      border: 1px solid rgba(90, 150, 255, 0.12);
    }

    .trend-note {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.6;
    }

    .summary-line-label {
      color: var(--muted);
      margin-right: 8px;
    }

    .rank-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    .rank-main {
      font-weight: 600;
    }

    .star-note {
      display: block;
      margin-top: 10px;
      color: #ffd787;
      line-height: 1.75;
    }

    .tag-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .tag {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      background: rgba(77, 226, 255, 0.12);
      border: 1px solid rgba(77, 226, 255, 0.22);
      color: var(--cyan);
      font-size: 12px;
    }

    .forest-section h2::before {
      display: none;
    }

    .forest-section h2 {
      gap: 12px;
      font-size: 25px;
    }

    .forest-title-icon {
      display: inline-grid;
      width: 38px;
      height: 38px;
      place-items: center;
      border-radius: 12px;
      background: rgba(77, 226, 255, 0.12);
      border: 1px solid rgba(77, 226, 255, 0.25);
      font-size: 22px;
    }

    .topic-forest-card {
      padding: 18px;
      border-radius: 20px;
      background:
        radial-gradient(circle at 50% 50%, rgba(77, 226, 255, 0.08), transparent 44%),
        linear-gradient(180deg, rgba(13, 22, 46, 0.92), rgba(8, 14, 30, 0.96));
      border: 1px solid rgba(157, 181, 230, 0.22);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
      overflow: hidden;
    }

    .forest-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin: 2px 4px 12px;
      flex-wrap: wrap;
    }

    .forest-kicker {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.08em;
    }

    .forest-note {
      color: var(--muted);
      font-size: 12px;
    }

    .topic-forest {
      display: block;
      width: 100%;
      min-height: 510px;
      border-radius: 16px;
      background:
        radial-gradient(circle at center, rgba(77, 226, 255, 0.08), transparent 36%),
        rgba(255, 255, 255, 0.012);
      border: 1px solid rgba(157, 181, 230, 0.16);
    }

    .word-cloud-card {
      padding: 18px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(13, 22, 46, 0.92), rgba(8, 14, 30, 0.96));
      border: 1px solid rgba(90, 150, 255, 0.18);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
    }

    .word-cloud-canvas {
      display: block;
      width: 100%;
      max-width: 100%;
      margin: 0 auto;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.02);
    }

    .support-section {
      padding: 36px 40px 38px;
      text-align: center;
      border-top: 1px solid rgba(90, 150, 255, 0.16);
      background:
        radial-gradient(circle at 50% 20%, rgba(59, 240, 195, 0.10), transparent 40%),
        linear-gradient(180deg, rgba(10, 18, 38, 0.88), rgba(6, 11, 24, 0.94));
    }

    .support-title {
      margin: 0;
      color: #ffffff;
      font-size: 25px;
      line-height: 1.35;
    }

    .support-copy {
      max-width: 520px;
      margin: 12px auto 0;
      color: var(--muted);
      line-height: 1.8;
      font-size: 15px;
    }

    .support-image {
      display: block;
      width: min(320px, 100%);
      height: auto;
      margin: 22px auto 0;
      border-radius: 18px;
      border: 1px solid rgba(59, 240, 195, 0.34);
      box-shadow: 0 0 30px rgba(59, 240, 195, 0.18);
      background: #ffffff;
    }

    .footer {
      padding: 20px 0 0;
      color: #6f86b7;
      font-size: 13px;
      text-align: center;
    }

    @media (max-width: 720px) {
      body {
        padding: 14px;
      }

      .hero,
      .section,
      .footer {
        padding-left: 20px;
        padding-right: 20px;
      }

      h1 {
        font-size: 28px;
      }

      .support-section {
        padding-left: 20px;
        padding-right: 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="hero">
      <div class="eyebrow">群聊情报报告</div>
      <h1>{{GROUP_NAME}} 群聊{{REPORT_TYPE}}（{{DATE_RANGE}}）</h1>
      <div class="subtitle">{{SUMMARY_BLURB}}</div>
    </div>

    <div class="section">
      <h2>区间总览</h2>
      <div class="summary-grid">
        {{SUMMARY_CARDS}}
        {{TREND_CARD}}
      </div>
      {{SUMMARY_LINE}}
    </div>

    <div class="section">
      <h2>群聊热点话题</h2>
      <ul>
        {{HOT_TOPICS}}
      </ul>
    </div>

    <div class="section">
      <h2>区间活跃之星</h2>
      <ol>
        {{ACTIVE_STARS}}
      </ol>
    </div>

    <div class="section forest-section">
      <h2><span class="forest-title-icon">🌳</span>本期话题小森林</h2>
      <div class="topic-forest-card">
        <div class="forest-head">
          <span class="forest-kicker">从核心关注向群聊话题生长</span>
          <span id="forest-note" class="forest-note"></span>
        </div>
        <svg id="topic-forest" class="topic-forest" viewBox="0 0 1280 760" role="img" aria-label="本期话题小森林"></svg>
      </div>
    </div>

    <div class="section">
      <h2>关键词云</h2>
      <div class="word-cloud-card">
        <canvas id="cloud" class="word-cloud-canvas" width="860" height="560"></canvas>
      </div>
    </div>

    <div class="support-section">
      <h2 class="support-title">这个报告有点意思?</h2>
      <p class="support-copy">如果这份报告给你带来了片刻欢乐，不妨请幕后开发者喝杯咖啡，激励我创造更多有趣的瞬间!</p>
      <img class="support-image" src="{{SUPPORT_QR_IMAGE}}" alt="请开发者喝杯咖啡二维码">
      <div class="footer">报告由小涛基于微信群聊生成</div>
    </div>
  </div>
  <script>
    const words = {{WORD_CLOUD_DATA}};
    const trendData = {{TREND_DATA}};
    const forestData = {{TOPIC_FOREST_DATA}};

    (function renderTopicForest() {
      const forest = document.getElementById('topic-forest');
      const note = document.getElementById('forest-note');
      const svgNs = 'http://www.w3.org/2000/svg';
      const palette = ['#f27bbc', '#ffdf61', '#c8ef70', '#af7ce8', '#e97bde', '#6edfcf'];
      const label = (value) => Array.from(String(value || '')).slice(0, 12).join('');
      const element = (tag, attributes = {}) => {
        const node = document.createElementNS(svgNs, tag);
        Object.entries(attributes).forEach(([key, value]) => node.setAttribute(key, value));
        return node;
      };
      const wrap = (value, width) => {
        const characters = Array.from(label(value));
        const lines = [];
        for (let index = 0; index < characters.length; index += width) {
          lines.push(characters.slice(index, index + width).join(''));
        }
        return lines.length ? lines : [''];
      };
      const addLines = (group, lines, x, y, options = {}) => {
        const lineHeight = options.lineHeight || 20;
        const startY = y - ((lines.length - 1) * lineHeight) / 2;
        lines.forEach((line, index) => {
          const text = element('text', {
            x,
            y: startY + index * lineHeight,
            fill: options.fill || '#101623',
            'font-size': options.size || 16,
            'font-weight': options.weight || '700',
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-family': '"Microsoft YaHei", "PingFang SC", sans-serif'
          });
          text.textContent = line;
          group.appendChild(text);
        });
      };
      const contrast = (color) => {
        const match = /^#([0-9a-f]{6})$/i.exec(color || '');
        if (!match) return '#101623';
        const value = match[1];
        const red = parseInt(value.slice(0, 2), 16);
        const green = parseInt(value.slice(2, 4), 16);
        const blue = parseInt(value.slice(4, 6), 16);
        return (red * 299 + green * 587 + blue * 114) / 1000 > 156 ? '#101623' : '#ffffff';
      };
      const card = (x, y, width, height, title, color, options = {}) => {
        const group = element('g', { 'aria-label': label(title) });
        group.appendChild(element('rect', {
          x: x - width / 2,
          y: y - height / 2,
          width,
          height,
          rx: 8,
          fill: color,
          stroke: color,
          'stroke-width': 1
        }));
        group.appendChild(element('rect', {
          x: x - width / 2,
          y: y + height / 2 - 5,
          width,
          height: 5,
          fill: 'rgba(255,255,255,0.44)'
        }));
        const icon = options.icon ? label(options.icon).slice(0, 2) : '';
        if (icon) {
          const iconText = element('text', {
            x: x - width / 2 + 32,
            y,
            fill: contrast(color),
            'font-size': 28,
            'text-anchor': 'middle',
            'dominant-baseline': 'middle',
            'font-family': '"Apple Color Emoji", "Segoe UI Emoji", sans-serif'
          });
          iconText.textContent = icon;
          group.appendChild(iconText);
        }
        addLines(group, wrap(title, options.lineChars || 8), x + (icon ? 14 : 0), y, {
          fill: options.textColor || contrast(color),
          size: options.size || 16,
          lineHeight: options.lineHeight || 20,
          weight: options.weight || '700'
        });
        return group;
      };
      const centerNode = (x, y, title) => {
        const group = element('g', { 'aria-label': label(title) });
        group.appendChild(element('circle', {
          cx: x,
          cy: y,
          r: 102,
          fill: '#2039d7',
          stroke: '#6a8aff',
          'stroke-width': 3
        }));
        group.appendChild(element('circle', {
          cx: x,
          cy: y,
          r: 92,
          fill: 'none',
          stroke: 'rgba(255,255,255,0.16)',
          'stroke-width': 1
        }));
        addLines(group, wrap(title, 7), x, y, {
          fill: '#ffffff',
          size: 22,
          lineHeight: 27,
          weight: '800'
        });
        return group;
      };
      const center = forestData && forestData.center ? forestData.center : {};
      const branches = Array.isArray(forestData && forestData.branches)
        ? forestData.branches.slice(0, 6).filter((branch) => branch && branch.title)
        : [];

      if (!branches.length) {
        forest.closest('.section').hidden = true;
        return;
      }

      forest.replaceChildren();
      const width = 1280;
      const height = 760;
      const centerX = width / 2;
      const centerY = height / 2;
      if (note) note.textContent = String(center.note || '群聊长期关注');

      const layout = branches.map((branch, index) => {
        const angle = ((-140 + (360 * index) / branches.length) * Math.PI) / 180;
        const color = branch.color || palette[index % palette.length];
        const branchX = centerX + Math.cos(angle) * 225;
        const branchY = centerY + Math.sin(angle) * 225;
        const topics = Array.isArray(branch.topics) ? branch.topics.slice(0, 6) : [];
        return { branch, angle, color, branchX, branchY, topics };
      });

      layout.forEach(({ angle, color, branchX, branchY, topics }) => {
        forest.appendChild(element('path', {
          d: `M ${centerX + Math.cos(angle) * 92} ${centerY + Math.sin(angle) * 92} L ${branchX} ${branchY}`,
          fill: 'none',
          stroke: color,
          'stroke-width': 9,
          'stroke-linecap': 'round',
          'stroke-opacity': 0.82
        }));

        topics.forEach((topic, topicIndex) => {
          const offset = (topicIndex - (topics.length - 1) / 2) * (topics.length > 4 ? 62 : 82);
          const perpendicularX = -Math.sin(angle);
          const perpendicularY = Math.cos(angle);
          const rawLeafX = branchX + Math.cos(angle) * 150 + perpendicularX * offset;
          const rawLeafY = branchY + Math.sin(angle) * 150 + perpendicularY * offset;
          const leafX = Math.max(118, Math.min(width - 118, rawLeafX));
          const leafY = Math.max(42, Math.min(height - 42, rawLeafY));
          forest.appendChild(element('path', {
            d: `M ${branchX} ${branchY} L ${leafX} ${leafY}`,
            fill: 'none',
            stroke: color,
            'stroke-width': 7,
            'stroke-linecap': 'round',
            'stroke-opacity': 0.74
          }));
        });
      });

      layout.forEach(({ branch, angle, color, branchX, branchY, topics }) => {
        topics.forEach((topic, topicIndex) => {
          const offset = (topicIndex - (topics.length - 1) / 2) * (topics.length > 4 ? 62 : 82);
          const perpendicularX = -Math.sin(angle);
          const perpendicularY = Math.cos(angle);
          const rawLeafX = branchX + Math.cos(angle) * 150 + perpendicularX * offset;
          const rawLeafY = branchY + Math.sin(angle) * 150 + perpendicularY * offset;
          const leafX = Math.max(118, Math.min(width - 118, rawLeafX));
          const leafY = Math.max(42, Math.min(height - 42, rawLeafY));
          forest.appendChild(card(leafX, leafY, 190, 58, topic, color, {
            size: 15,
            lineChars: 9,
            lineHeight: 18
          }));
        });
        forest.appendChild(card(branchX, branchY, 224, 72, branch.title, color, {
          icon: branch.icon,
          size: 19,
          lineChars: 8,
          lineHeight: 22,
          weight: '800'
        }));
      });

      forest.appendChild(centerNode(centerX, centerY, center.title || '群聊核心关注'));
    })();

    if (window.WordCloud) {
      WordCloud(document.getElementById('cloud'), {
        list: words,
        gridSize: 10,
        weightFactor: 3,
        fontFamily: '"Microsoft YaHei", "PingFang SC", sans-serif',
        backgroundColor: 'rgba(0,0,0,0)',
        rotateRatio: 0.35,
        minSize: 16,
        shrinkToFit: true,
        drawOutOfBound: false,
        color: function () {
          const colors = [
            '#4de2ff',
            '#7b61ff',
            '#5b8cff',
            '#9c7dff',
            '#6a5acd',
            '#b39ddb'
          ];

          return colors[Math.floor(Math.random() * colors.length)];
        }
      });
    }

    (function renderTrend() {
      const canvas = document.getElementById('trend');
      if (!canvas || !trendData || !trendData.length) return;

      const dpr = window.devicePixelRatio || 1;
      const rect = canvas.getBoundingClientRect();
      const width = rect.width || canvas.width;
      const height = rect.height || canvas.height;
      canvas.width = Math.round(width * dpr);
      canvas.height = Math.round(height * dpr);

      const ctx = canvas.getContext('2d');
      ctx.scale(dpr, dpr);

      const pad = 40;
      const bottomPad = 34;
      const topPad = 18;
      const leftPad = 44;
      const w = width;
      const h = height;
      const ys = trendData.map((p) => p[1]);
      const minY = Math.min(...ys);
      const maxY = Math.max(...ys);
      const rangeY = Math.max(maxY - minY, 1);
      const plotW = w - leftPad - pad;
      const plotH = h - topPad - bottomPad;
      const stepX = trendData.length > 1 ? plotW / (trendData.length - 1) : 0;
      const points = trendData.map((point, index) => ({
        label: point[0],
        value: point[1],
        x: leftPad + stepX * index,
        y: h - bottomPad - ((point[1] - minY) / rangeY) * plotH
      }));

      ctx.clearRect(0, 0, w, h);

      for (let i = 0; i < 5; i++) {
        const y = topPad + (plotH / 4) * i;
        ctx.strokeStyle = 'rgba(142, 164, 212, 0.14)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(leftPad, y);
        ctx.lineTo(w - pad, y);
        ctx.stroke();
      }

      for (let i = 0; i < points.length; i++) {
        const x = points[i].x;
        ctx.strokeStyle = 'rgba(142, 164, 212, 0.12)';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, topPad);
        ctx.lineTo(x, h - bottomPad);
        ctx.stroke();
      }

      ctx.beginPath();
      if (points.length === 1) {
        ctx.moveTo(points[0].x, points[0].y);
        ctx.lineTo(points[0].x, points[0].y);
      } else {
        ctx.moveTo(points[0].x, points[0].y);
        for (let i = 0; i < points.length - 1; i++) {
          const current = points[i];
          const next = points[i + 1];
          const cp1x = current.x + stepX * 0.35;
          const cp1y = current.y;
          const cp2x = next.x - stepX * 0.35;
          const cp2y = next.y;
          ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, next.x, next.y);
        }
      }
      ctx.strokeStyle = '#4de2ff';
      ctx.lineWidth = 2.5;
      ctx.shadowColor = 'rgba(77, 226, 255, 0.35)';
      ctx.shadowBlur = 10;
      ctx.stroke();
      ctx.shadowBlur = 0;

      points.forEach((point) => {
        ctx.beginPath();
        ctx.arc(point.x, point.y, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#5b8cff';
        ctx.fill();
      });

      ctx.fillStyle = '#8ea4d4';
      ctx.font = '12px "Microsoft YaHei", "PingFang SC", sans-serif';
      ctx.textAlign = 'center';
      const labelStep = points.length <= 8 ? 1 : points.length <= 16 ? 2 : points.length <= 24 ? 3 : 4;
      points.forEach((point, index) => {
        if (index === 0 || index === points.length - 1 || index % labelStep === 0) {
          ctx.fillText(point.label, point.x, h - 12);
        }
      });

      ctx.textAlign = 'right';
      ctx.fillText(String(maxY), leftPad - 10, topPad + 4);
      ctx.fillText(String(minY), leftPad - 10, h - bottomPad + 4);
    })();
  </script>
</body>
</html>
