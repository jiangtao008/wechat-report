<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信群周报 · 报告总览</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(10, 18, 38, 0.88);
      --panel-strong: rgba(14, 25, 52, 0.96);
      --line: rgba(90, 150, 255, 0.22);
      --text: #dbe7ff;
      --text-dim: #6a7da6;
      --muted: #8ea4d4;
      --cyan: #4de2ff;
      --blue: #5b8cff;
      --green: #3bf0c3;
      --purple: #af7ce8;
      --orange: #f0a33b;
      --glow: 0 0 24px rgba(77, 226, 255, 0.16);
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at top left, rgba(91, 140, 255, 0.24), transparent 28%),
        radial-gradient(ellipse at top right, rgba(77, 226, 255, 0.18), transparent 24%),
        linear-gradient(180deg, #040712 0%, #081022 52%, #050816 100%);
      min-height: 100vh;
      padding: 32px 16px;
    }

    .container {
      max-width: 880px;
      margin: 0 auto;
    }

    /* ─── Header ─── */
    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      font-size: 2.2rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    header .subtitle {
      color: var(--muted);
      font-size: 0.95rem;
    }

    header .subtitle .count-badge {
      display: inline-block;
      background: rgba(77, 226, 255, 0.12);
      border: 1px solid rgba(77, 226, 255, 0.25);
      padding: 2px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: var(--cyan);
      margin-left: 8px;
    }

    /* ─── Stats bar ─── */
    .stats-bar {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 32px;
    }

    .stat-chip {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 6px 18px;
      font-size: 0.82rem;
      color: var(--muted);
    }

    .stat-chip strong {
      color: var(--text);
      font-weight: 600;
    }

    /* ─── Tree ─── */
    .tree { display: flex; flex-direction: column; gap: 12px; }

    /* Group node */
    .group-node {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      transition: border-color 0.3s ease;
    }

    .group-node.expanded {
      border-color: rgba(77, 226, 255, 0.35);
    }

    .group-header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      cursor: pointer;
      user-select: none;
      transition: background 0.2s ease;
    }

    .group-header:hover {
      background: rgba(77, 226, 255, 0.04);
    }

    .group-header .toggle-icon {
      flex-shrink: 0;
      width: 24px;
      height: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: var(--muted);
      transition: transform 0.3s ease;
    }

    .group-node.expanded .toggle-icon {
      transform: rotate(90deg);
    }

    .group-header .group-icon {
      flex-shrink: 0;
      font-size: 1.3rem;
    }

    .group-header .group-name {
      flex: 1;
      font-size: 1.05rem;
      font-weight: 600;
    }

    .group-header .file-count {
      flex-shrink: 0;
      font-size: 0.75rem;
      color: var(--text-dim);
      background: rgba(90, 150, 255, 0.1);
      border-radius: 20px;
      padding: 2px 10px;
    }

    .group-header .group-arrow {
      flex-shrink: 0;
      font-size: 1.1rem;
      color: var(--text-dim);
      transition: all 0.3s ease;
    }

    .group-node.expanded .group-arrow {
      color: var(--cyan);
    }

    /* File list */
    .file-list {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease;
    }

    .group-node.expanded .file-list {
      max-height: 1000px; /* plenty for any group */
    }

    .file-items {
      padding: 0 20px 14px 68px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .file-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 14px;
      border-radius: 8px;
      text-decoration: none;
      color: var(--text);
      transition: all 0.25s ease;
      position: relative;
    }

    .file-item::before {
      content: '';
      position: absolute;
      left: -16px;
      top: 0;
      bottom: 0;
      width: 2px;
      background: var(--line);
      border-radius: 1px;
      transition: background 0.3s ease;
    }

    .file-item:hover {
      background: rgba(77, 226, 255, 0.06);
    }

    .file-item:hover::before {
      background: var(--cyan);
    }

    .file-item .file-icon {
      flex-shrink: 0;
      font-size: 1rem;
      opacity: 0.7;
    }

    .file-item .file-title {
      flex: 1;
      font-size: 0.92rem;
      font-weight: 500;
    }

    .file-item .file-meta {
      flex-shrink: 0;
      font-size: 0.78rem;
      color: var(--text-dim);
      max-width: 220px;
      text-align: right;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file-item .file-link-icon {
      flex-shrink: 0;
      font-size: 0.85rem;
      color: var(--text-dim);
      transition: all 0.3s ease;
    }

    .file-item:hover .file-link-icon {
      color: var(--cyan);
      transform: translateX(3px);
    }

    /* Empty fallback */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 12px;
    }

    .empty-state p {
      color: var(--muted);
    }

    /* ─── Footer ─── */
    footer {
      text-align: center;
      margin-top: 48px;
      padding-top: 20px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.82rem;
      display: flex;
      justify-content: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }

    footer .dot {
      color: var(--line);
    }

    /* ─── Loading ─── */
    .loading-spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--line);
      border-top-color: var(--cyan);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-right: 8px;
      vertical-align: middle;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ─── Responsive ─── */
    @media (max-width: 640px) {
      header h1 { font-size: 1.6rem; }
      .group-header { padding: 12px 14px; }
      .file-items { padding: 0 14px 12px 48px; }
      .file-item .file-meta { display: none; }
      .file-item { padding: 8px 10px; }
      .stat-chip { font-size: 0.75rem; padding: 4px 12px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 微信群周报</h1>
      <p class="subtitle">
        选择报告查看群聊动态分析
        <span class="count-badge" id="total-badge">…</span>
      </p>
    </header>

    <div class="stats-bar" id="stats-bar"></div>

    <div class="tree" id="tree">
      <div class="empty-state">
        <div class="icon">
          <span class="loading-spinner"></span>
        </div>
        <p>正在加载报告列表…</p>
      </div>
    </div>

    <footer>
      <a href="https://github.com/jiangtao008/wechat-report" target="_blank">GitHub</a>
      <span class="dot">·</span>
      <span>自动生成 · 群聊洞察</span>
      <span class="dot">·</span>
      <span id="update-time"></span>
    </footer>
  </div>

  <script>
    // ─── 加载 index.json ────────────────────────────────────────
    // 如果 fetch 失败（例如 file:// 协议不支持），回退到内嵌数据
    const FALLBACK_DATA = {
      updated: '2026-07-31T15:00:00+08:00',
      groups: [
        {
          name: 'Tesla特特特能说',
          files: [
            { title: 'Tesla特特特能说', file: 'report/Tesla特特特能说/Tesla特特特能说_20260729.html', meta: '2026-07-29' },
            { title: 'Tesla特特特能说', file: 'report/Tesla特特特能说/Tesla特特特能说_20260731.html', meta: '2026-07-31' },
            { title: 'Tesla特特特能说', file: 'report/Tesla特特特能说/Tesla特特特能说_群聊周报.html', meta: '群聊周报' }
          ]
        },
        {
          name: '长沙正能量搭子群',
          files: [
            { title: '长沙正能量搭子群', file: 'report/长沙正能量搭子群/长沙正能量搭子群_周报.html', meta: '群聊周报' }
          ]
        },
        {
          name: '湖南露营学院',
          files: [
            { title: '湖南露营学院', file: 'report/湖南露营学院/湖南露营学院_群聊周报.html', meta: '群聊周报' }
          ]
        },
        {
          name: '保利北中心G区业主群',
          files: [
            { title: '保利北中心G区业主群', file: 'report/保利北中心G区业主群/保利北中心G区业主群_20260729.html', meta: '2026-07-29' }
          ]
        },
        {
          name: '星城神仙小分队',
          files: [
            { title: '星城神仙小分队', file: 'report/星城神仙小分队/星城神仙小分队_20260729.html', meta: '2026-07-29' }
          ]
        },
        {
          name: '长沙长沙（返湘1群）',
          files: [
            { title: '长沙长沙（返湘1群）', file: 'report/长沙长沙（返湘1群）/长沙长沙（返湘1群）_20260730.html', meta: '2026-07-30' }
          ]
        },
        {
          name: '风林的Ai交流群',
          files: [
            { title: '风林的Ai交流群', file: 'report/风林的Ai交流群/风林的Ai交流群_20260731.html', meta: '2026-07-31' }
          ]
        }
      ]
    };

    // 为每个 group 分配颜色
    const GROUP_COLORS = ['#5b8cff', '#3bf0c3', '#af7ce8', '#f0a33b', '#ff6b8a', '#4de2ff'];
    const GROUP_ICONS = ['💬', '🤝', '🏕️', '🎯', '⭐', '🔮'];

    function getGroupStyle(index) {
      const c = GROUP_COLORS[index % GROUP_COLORS.length];
      return {
        color: c,
        borderColor: c + '44',
        bg: c + '0d',
        icon: GROUP_ICONS[index % GROUP_ICONS.length],
      };
    }

    function render(data) {
      const groups = data.groups || [];
      const totalFiles = groups.reduce((s, g) => s + (g.files?.length || 0), 0);

      // Badge
      document.getElementById('total-badge').textContent = totalFiles + ' 份报告';

      // Stats bar
      const statsEl = document.getElementById('stats-bar');
      statsEl.innerHTML = [
        `<span class="stat-chip">📁 <strong>${groups.length}</strong> 个群组</span>`,
        `<span class="stat-chip">📄 <strong>${totalFiles}</strong> 份报告</span>`,
      ].join('');

      // Update time
      if (data.updated) {
        document.getElementById('update-time').textContent = '更新于 ' + data.updated.replace('T', ' ').replace(/\.\d+Z/, '').replace(/[+-]\d{2}:\d{2}$/, '');
      }

      // Tree
      const treeEl = document.getElementById('tree');

      if (groups.length === 0) {
        treeEl.innerHTML = `
          <div class="empty-state">
            <div class="icon">📭</div>
            <p>暂无报告，请先生成一份群聊周报</p>
          </div>
        `;
        return;
      }

      treeEl.innerHTML = groups.map((group, gi) => {
        const files = group.files || [];
        const style = getGroupStyle(gi);
        const groupId = 'group-' + gi;

        const fileItems = files.map((f, fi) => {
          // 从 file 路径提取文件名并去掉扩展名，用于显示
          const basename = (f.file.split('/').pop() || '').replace(/\.html?$/, '');
          return `
          <a class="file-item" href="${escapeHtml(f.file)}" title="${escapeHtml(f.meta)}">
            <span class="file-icon">📄</span>
            <span class="file-title">${escapeHtml(basename)}</span>
            <span class="file-meta">${escapeHtml(f.meta)}</span>
            <span class="file-link-icon">→</span>
          </a>
        `}).join('');

        return `
          <div class="group-node expanded" data-group="${gi}">
            <div class="group-header" onclick="toggleGroup(${gi})">
              <span class="toggle-icon">▶</span>
              <span class="group-icon">${style.icon}</span>
              <span class="group-name" style="color:${style.color}">${escapeHtml(group.name || group.label || group.title || '未命名群组')}</span>
              <span class="file-count">${files.length} 份</span>
              <span class="group-arrow">→</span>
            </div>
            <div class="file-list">
              <div class="file-items">
                ${fileItems || '<div style="color:var(--text-dim);padding:8px 0;font-size:0.85rem;">该目录暂无 HTML 报告</div>'}
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleGroup(index) {
      const node = document.querySelector(`.group-node[data-group="${index}"]`);
      if (node) {
        node.classList.toggle('expanded');
      }
    }

    function escapeHtml(str) {
      const div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    // ─── Bootstrap ──────────────────────────────────────────────
    // Try fetching index.json; on failure use fallback
    fetch('./index.json')
      .then(r => r.json())
      .then(data => render(data))
      .catch(() => {
        console.warn('index.json 加载失败（file:// 协议常见），使用内嵌数据。');
        console.warn('提示：运行 bash generate-index.sh 可更新 index.json');
        render(FALLBACK_DATA);
      });
  </script>
</body>
</html>
