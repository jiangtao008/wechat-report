<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>微信群周报</title>
  <style>
    :root {
      --bg: #050816;
      --panel: rgba(10, 18, 38, 0.88);
      --panel-strong: rgba(14, 25, 52, 0.96);
      --line: rgba(90, 150, 255, 0.22);
      --text: #dbe7ff;
      --muted: #8ea4d4;
      --cyan: #4de2ff;
      --blue: #5b8cff;
      --green: #3bf0c3;
      --glow: 0 0 24px rgba(77, 226, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "Segoe UI", "PingFang SC", "Noto Sans SC", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at top left, rgba(91, 140, 255, 0.24), transparent 28%),
        radial-gradient(circle at top right, rgba(77, 226, 255, 0.18), transparent 24%),
        linear-gradient(180deg, #040712 0%, #081022 52%, #050816 100%);
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 48px;
    }

    header h1 {
      font-size: 2.4rem;
      font-weight: 700;
      background: linear-gradient(135deg, var(--cyan), var(--blue));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    header p {
      color: var(--muted);
      font-size: 1rem;
    }

    .report-grid {
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .report-card {
      background: var(--panel-strong);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 28px 32px;
      transition: all 0.3s ease;
      cursor: pointer;
      text-decoration: none;
      display: block;
      position: relative;
      overflow: hidden;
    }

    .report-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 4px;
      height: 100%;
      background: linear-gradient(180deg, var(--cyan), var(--blue));
      opacity: 0.6;
      transition: opacity 0.3s ease;
    }

    .report-card:hover {
      border-color: var(--cyan);
      box-shadow: var(--glow), 0 8px 32px rgba(77, 226, 255, 0.08);
      transform: translateY(-2px);
    }

    .report-card:hover::before {
      opacity: 1;
    }

    .report-card .group-tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      margin-bottom: 12px;
      letter-spacing: 0.5px;
    }

    .group-tag.group-1 {
      background: rgba(91, 140, 255, 0.18);
      color: var(--blue);
      border: 1px solid rgba(91, 140, 255, 0.3);
    }

    .group-tag.group-2 {
      background: rgba(59, 240, 195, 0.15);
      color: var(--green);
      border: 1px solid rgba(59, 240, 195, 0.3);
    }

    .report-card h2 {
      font-size: 1.25rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }

    .report-card .meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .report-card .arrow {
      position: absolute;
      right: 28px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.5rem;
      color: var(--muted);
      transition: all 0.3s ease;
    }

    .report-card:hover .arrow {
      color: var(--cyan);
      right: 24px;
    }

    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }

    .empty-state .icon {
      font-size: 3rem;
      margin-bottom: 16px;
    }

    footer {
      text-align: center;
      margin-top: 60px;
      padding-top: 24px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-size: 0.85rem;
    }

    footer a {
      color: var(--cyan);
      text-decoration: none;
    }

    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 微信群周报</h1>
      <p>选择下方报告查看群聊动态分析</p>
    </header>

    <div class="report-grid" id="report-list">
      <div class="empty-state">
        <div class="icon">📭</div>
        <p>正在加载报告列表…</p>
      </div>
    </div>

    <footer>
      <a href="https://github.com/jiangtao008/wechat-report" target="_blank">GitHub</a> ·
      <span>自动生成 · 群聊洞察</span>
    </footer>
  </div>

  <script>
    // 报告列表 — 新增报告在这里添加
    const REPORTS = [
      {
        title: 'Tesla特特特能说',
        file: 'group-1/Tesla特特特能说_群聊周报.html',
        group: 'group-1',
        meta: '特斯拉车友群 · 群聊周报'
      },
      {
        title: '长沙正能量搭子❶群',
        file: 'group-2/长沙正能量搭子群_周报.html',
        group: 'group-2',
        meta: '长沙本地搭子群 · 群聊周报'
      }
    ];

    const el = document.getElementById('report-list');

    if (REPORTS.length === 0) {
      el.innerHTML = `
        <div class="empty-state">
          <div class="icon">📭</div>
          <p>暂无报告，请先生成一份群聊周报</p>
        </div>
      `;
    } else {
      el.innerHTML = REPORTS.map(r => `
        <a class="report-card" href="${r.file}">
          <span class="group-tag ${r.group}">${r.group}</span>
          <h2>${r.title}</h2>
          <div class="meta">${r.meta}</div>
          <span class="arrow">→</span>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
